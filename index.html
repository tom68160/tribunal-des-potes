<!doctype html>
<html lang="fr">
<head>
<title>Tribunal des Potes</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Le jeu de soirée qui juge tes potes : 9 mini-jeux, votes, procès, imposteur. Versions Soft et Hardcore.">
<meta property="og:type" content="website">
<meta property="og:title" content="Tribunal des Potes">
<meta property="og:description" content="Le jeu de soirée qui juge tes potes : 9 mini-jeux, votes, procès, imposteur. Versions Soft et Hardcore.">
<meta property="og:image" content="https://tom68160.github.io/tribunal-des-potes/cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#2235e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@700&family=Chakra+Petch:wght@500;600;700&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: one centered arcade column, navy pixel panels on a flat blue field, chunky notched buttons. Single fixed look. */
:root{
  --field:#5d6fd8; --field-2:#6b7ce0;
  --panel:#1d3266; --panel-line:#c7d1ff; --ink:#eef1ff; --ink-dim:#a9b5ec;
  --cyan:#74d4ef; --cyan-dk:#3a9fc2; --purple:#a35ae6; --purple-dk:#7232b5;
  --green:#2fd06a; --green-dk:#159447; --gold:#f6c94c; --red:#e8484f; --on-light:#11264f;
  --f-logo:"Silkscreen","Courier New",monospace;
  --f-display:"Chakra Petch","Arial Narrow","Segoe UI",sans-serif;
  --f-body:"Rubik","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:linear-gradient(180deg,var(--field),var(--field-2));color:var(--ink);font-family:var(--f-body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:64px 48px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:22px}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.9;text-align:center}
h1{font-family:var(--f-logo);font-weight:700;font-size:clamp(26px,7vw,40px);line-height:1.05;margin:0;text-align:center;text-wrap:balance;
  color:var(--ink);text-shadow:3px 3px 0 var(--panel)}
h2{font-family:var(--f-display);font-size:18px;margin:0;text-align:center;text-wrap:balance;line-height:1.35}
p{margin:0}
.muted{color:var(--ink-dim)}
.small{font-size:13px}

/* pixel panel */
.panel{background:var(--panel);border:3px solid var(--panel-line);box-shadow:4px 4px 0 rgba(17,38,79,.45);padding:16px;width:100%}
.panel-title{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-align:center;margin-bottom:12px;text-transform:uppercase}

/* chunky notched buttons */
.btn{--c:var(--cyan);--d:var(--cyan-dk);--t:var(--on-light);
  font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--t);
  background:var(--c);border:0;padding:12px 20px 14px;cursor:pointer;
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);
  box-shadow:inset 0 -5px 0 var(--d),inset 0 3px 0 rgba(255,255,255,.35);transition:transform .08s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn[disabled]{filter:grayscale(.8) brightness(.8);cursor:not-allowed}
.btn.purple{--c:var(--purple);--d:var(--purple-dk);--t:#fff}
.btn.green{--c:var(--green);--d:var(--green-dk);--t:#0b331a;font-size:19px;padding:14px 28px 16px}
.btn.ghost{--c:var(--panel);--d:#0f1f45;--t:var(--ink);font-size:13px;padding:9px 14px 11px}
.btn.wide{width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}

/* code squares */
.code{display:flex;gap:8px;justify-content:center}
.code span{width:30px;height:34px;background:#f4f6ff;color:var(--on-light);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;
  box-shadow:inset 0 -3px 0 #c9d0ef}

/* inputs */
label.lab{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px}
input.inp,textarea.inp{width:100%;box-sizing:border-box;font-family:var(--f-body);font-size:18px;color:var(--on-light);background:#f4f6ff;border:3px solid var(--panel-line);padding:10px 12px;outline:none}
input.inp:focus,textarea.inp:focus{border-color:var(--gold)}
input.code-inp{font-family:var(--f-display);letter-spacing:.3em;text-transform:uppercase;text-align:center;font-size:22px}
textarea.inp{min-height:96px;resize:vertical}

/* players */
.players{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
.pcard{background:var(--panel);border:3px solid var(--panel-line);width:104px;padding:20px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.pcard.me{border-color:var(--gold)}
.pname{font-family:var(--f-display);font-size:12px;text-transform:uppercase;text-align:center;word-break:break-word}
.crown{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:22px;line-height:1}
.av{width:52px;height:52px;display:grid;place-items:center;font-size:30px;line-height:1;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 4px 0 rgba(255,255,255,.3)}
.av.sm{width:30px;height:30px;font-size:17px;clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.avpick{background:none;border:0;padding:0;cursor:pointer}
.avpick:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* counts table */
.counts{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center}
.counts .name{font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stepper{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.stepper b{min-width:58px;text-align:center}
.round{width:26px;height:26px;border-radius:50%;border:0;background:#7f8fe6;color:#fff;font-size:18px;line-height:1;cursor:pointer;box-shadow:inset 0 -3px 0 #5466c9}
.round:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.round[disabled]{opacity:.35;cursor:not-allowed}

/* game */
.progress{display:flex;justify-content:space-between;width:100%;font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.qcard{text-align:center;display:flex;flex-direction:column;gap:10px}
.mode-chip{align-self:center;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:var(--on-light);padding:4px 10px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;width:100%}
.choice{background:#2a4486;border:3px solid #3f5aa3;color:var(--ink);padding:10px 8px;display:flex;align-items:center;gap:8px;cursor:pointer;font-family:var(--f-body);font-size:16px;text-align:left;min-width:0}
.choice span{min-width:0;overflow-wrap:anywhere}
.choice.on{border-color:var(--gold);background:#3a4f93;box-shadow:0 0 0 2px var(--gold)}
.choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.choice.big{font-size:18px;justify-content:center;text-align:center;padding:18px 12px}
.waiting{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wchip{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid #3f5aa3;padding:4px 10px 4px 4px;font-size:13px}
.wchip.done{border-color:var(--green)}
.wchip .tick{font-family:var(--f-display);font-size:12px;color:var(--green)}

/* tier */
.tier-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dashed #34508f}
.tier-row:last-child{border-bottom:0}
.tier-row .it{overflow-wrap:anywhere}
.tbtns{display:flex;gap:4px}
.tb{width:32px;height:32px;border:0;font-family:var(--f-display);font-weight:700;font-size:14px;cursor:pointer;color:var(--on-light);opacity:.45}
.tb.on{opacity:1;box-shadow:inset 0 0 0 3px var(--on-light)}
.tb:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.T0{background:#ff6f6f}.T1{background:#ffb36b}.T2{background:#ffe46b}.T3{background:#8ee08e}.T4{background:#73b9ff}
.tierboard{display:flex;flex-direction:column;gap:4px}
.tline{display:grid;grid-template-columns:48px 1fr;min-height:46px;background:#16285a}
.tline .tl{display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--on-light)}
.tline .ti{display:flex;flex-wrap:wrap;gap:6px;padding:6px;align-items:center}
.titem{background:#2a4486;padding:4px 8px;font-size:14px}

/* results */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.bar-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.bar-top b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.track{height:12px;background:#16285a}
.fill{height:100%;background:var(--cyan);box-shadow:inset 0 -3px 0 var(--cyan-dk)}
.bar.top .fill{background:var(--gold);box-shadow:inset 0 -3px 0 #c99a1e}
.voters{font-size:12px;color:var(--ink-dim);overflow-wrap:anywhere}
.split,.anec,.tierboard,.bars{width:100%}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split .col{background:#16285a;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.split .col h3{font-family:var(--f-display);font-size:12px;margin:0;line-height:1.4;overflow-wrap:anywhere}
.split .col.nice h3{color:var(--green)} .split .col.mean h3{color:#ff8f8f}
.who{display:flex;align-items:center;gap:6px;font-size:14px;min-width:0}
.who span{overflow-wrap:anywhere;min-width:0}
.anec{display:flex;flex-direction:column;gap:10px}
.anec .a{background:#16285a;padding:12px;border-left:4px solid var(--cyan);overflow-wrap:anywhere}
.anec .by{margin-top:8px;font-family:var(--f-display);font-size:12px;color:var(--gold);text-transform:uppercase}
.award{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:#16285a;padding:12px}
.award .t{font-family:var(--f-display);font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.award .n{font-size:18px;overflow-wrap:anywhere}
.stack{display:flex;flex-direction:column;gap:12px;width:100%}
.note{font-size:13px;color:var(--ink-dim);text-align:center;max-width:44ch;line-height:1.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--on-light);color:#fff;padding:10px 16px;font-size:14px;border:2px solid var(--panel-line);max-width:calc(100% - 32px)}
.used{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:2px dashed #34508f;text-align:center}
/* tier list : qui a voté quoi */
.tvotes{display:flex;flex-direction:column;gap:10px;width:100%}
.tcard{background:var(--panel);border:3px solid var(--panel-line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.tcard-h{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;overflow-wrap:anywhere}
.trow{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center}
.tl-sm{width:32px;height:32px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--on-light)}
.twho{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.wchip2{display:flex;align-items:center;gap:6px;background:#2a4486;padding:3px 8px 3px 3px;font-size:14px;min-width:0}
.accusers .twho{gap:8px}
.allvotes{width:100%}
.allvotes summary{cursor:pointer;text-align:center;font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);padding:6px}
.allvotes summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.allvotes .bars{margin-top:8px}
/* versions */
body[data-ver="hard"]{--field:#3d0f2b;--field-2:#6e1734}
.vers{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.verbtn{font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em;padding:10px 16px;border:3px solid #3f5aa3;background:#16285a;color:var(--ink);cursor:pointer}
.verbtn.on.soft{border-color:var(--cyan);background:#1f4f7a}
.verbtn.on.hard{border-color:#ff5a6a;background:#7a1a33}
.verbtn[disabled]{cursor:default;opacity:1}
.verbtn:not(.on)[disabled]{opacity:.45}
.verbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.warn{margin:12px 0 0;padding:10px 12px;background:#5a1430;border-left:4px solid #ff5a6a;font-size:14px;line-height:1.45}
/* musique */
.music-btn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:20;width:44px;height:44px;border:3px solid var(--panel-line);background:var(--panel);color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center;box-shadow:3px 3px 0 rgba(17,38,79,.45)}
.music-btn:focus-visible,.music-mute:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.music-panel{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:20;width:220px;max-width:calc(100vw - 20px);background:var(--panel);border:3px solid var(--panel-line);padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:4px 4px 0 rgba(17,38,79,.45)}
.music-title{font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.1em;text-align:center}
.music-row{display:flex;align-items:center;gap:10px}
.music-row input{flex:1;min-width:0;accent-color:var(--gold)}
.music-pct{font-family:var(--f-display);font-weight:700;font-size:14px;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.music-mute{font-family:var(--f-display);font-weight:600;font-size:13px;padding:8px;border:2px solid #3f5aa3;background:#16285a;color:var(--ink);cursor:pointer}
.music-note{margin:0;font-size:12px;color:var(--ink-dim);text-align:center}
/* classement */
.winlose{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wl h3{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.wl.w h3{color:#7ff0a8} .wl.l h3{color:#ff9a9a}
.pts{font-family:var(--f-display);color:var(--gold);margin-left:2px}
.rk-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed #34508f}
.rk-row:last-of-type{border-bottom:0}
.rk-row.last .rk-name{color:#ff9a9a}
.rk-pos{font-family:var(--f-display);font-weight:700;font-size:18px;text-align:center}
.rk-name{overflow-wrap:anywhere;font-size:16px}
.rk-wl{font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.rk-pts{font-family:var(--f-display);font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums}
@media (max-width:420px){.winlose{grid-template-columns:1fr}}
/* fond d'écran */
.backdrop{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
/* écran d'accueil */
body.splashing #app,body.splashing .music-btn,body.splashing .music-panel{visibility:hidden}
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 38%,rgba(17,26,70,0),rgba(8,12,36,.55));cursor:pointer;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));transition:opacity .4s ease, transform .4s ease}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:460px;width:100%}
.gavel-wrap{width:min(50vw,210px);aspect-ratio:40/30;max-width:100%;overflow:visible}
.gavel{width:100%;height:100%;image-rendering:pixelated;overflow:visible}
.gavel .hammer{transform-box:view-box;transform-origin:34px 27px;animation:swing 2.4s infinite cubic-bezier(.5,0,.75,0)}
.gavel .block{transform-box:view-box;transform-origin:11px 27px;animation:thud 2.4s infinite}
@keyframes swing{0%,15%{transform:rotate(38deg)}40%{transform:rotate(-3deg)}44%{transform:rotate(1deg)}48%,100%{transform:rotate(0deg)}}
@keyframes thud{0%,39%{transform:none}41%{transform:translateY(1px) scaleY(.85)}46%,100%{transform:none}}
.ordre{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,6vw,28px);letter-spacing:.12em;color:var(--gold);text-shadow:3px 3px 0 #7a1a33;margin-top:-10px;animation:ordre 2.4s infinite;opacity:0}
@keyframes ordre{0%,39%{opacity:0;transform:scale(.6)}43%{opacity:1;transform:scale(1.25) rotate(-4deg)}52%{transform:scale(1) rotate(-4deg)}75%{opacity:1}90%,100%{opacity:0}}
.splash-title{font-family:var(--f-logo);font-weight:700;line-height:.95;display:flex;flex-direction:column;align-items:center;color:var(--ink);text-shadow:4px 4px 0 var(--panel),0 0 24px rgba(246,201,76,.25);animation:shake 2.4s infinite}
.splash-title span:first-child{font-size:clamp(40px,13vw,72px)}
.splash-title span:last-child{font-size:clamp(28px,9vw,50px);color:var(--gold)}
@keyframes shake{0%,40%{transform:none}42%{transform:translate(-3px,2px)}44%{transform:translate(3px,-2px)}46%{transform:translate(-1px,1px)}48%,100%{transform:none}}
.splash-tag{margin:0;font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.splash-go{margin-top:10px;font-size:20px;animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{50%{filter:brightness(1.25)}}
.splash-foot{margin:6px 0 0;font-size:13px;color:var(--ink-dim)}
@media (prefers-reduced-motion:reduce){.gavel .hammer,.gavel .block,.ordre,.splash-title,.splash-go{animation:none}.gavel .hammer{transform:none}.ordre{opacity:1}.splash{transition:none}}
/* boîte de jeu (intro) */
.intro{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;cursor:pointer;overflow:hidden;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 3px,transparent 3px 41px),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 9px),linear-gradient(180deg,#3a2414,#5b3820 55%,#2e1b0e);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));transition:opacity .5s ease .4s}
.table-light{position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 42%,rgba(255,226,170,.28),transparent 70%),radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.55));pointer-events:none}
.box-stage{position:relative;perspective:900px;--w:min(70vw,290px);--h:calc(var(--w) * 1.32);--d:56px;width:var(--w);height:var(--h);animation:boxin .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes boxin{from{transform:translateY(40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.box3d{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(12deg) rotateY(-24deg) rotateZ(1deg);transition:transform .8s cubic-bezier(.5,0,.3,1)}
.face{position:absolute;backface-visibility:hidden}

function openHost(code) {

function openClient(code) {

    const peer = new Peer(PEER_OPTS);

    const bye = () => { if (conn && conn.open) { try { conn.send({ t: "bye" }); } catch (e) {} } };

      peers() { const m = Object.assign({}, all); if (myId) m[myId] = mine; return asPeers(m, myId); },

    };

      conn = c;

      c.on("open", () => { clearTimeout(watchdog); if (conn === c) { try { c.send({ t: "p", p: mine }); } catch (e) {} } });
      c.on("data", d => { if (conn === c && d && d.t === "all" && d.all && typeof d.all === "object") { all = d.all; notify(); } });

}

    const id = typeof p.presence.pid === "string" && /^[a-z0-9]{8,20}$/.test(p.presence.pid) ? p.presence.pid : p.peer;
    if (seen.has(id)) continue;

    out.push({ id, name: clean(p.presence.name) || "Anonyme", av: p.presence.av | 0, me: p.sameTab, host: p.presence.role === "host", ans: p.presence.ans });

}

async function pushPresence() {

  for (let tries = 0; tries < 40; tries++) {
    const base = { name: me.name, av: me.av, pid: PID, ans: myAns };
    if (iAmHost) Object.assign(base, { role: "host", since: H.since, st: H });
    try { await g.presence(base); return; }

      toast(e && e.code === "invalid_argument" ? "Trop de texte pour ce tour : raccourcis les réponses." : "Connexion perdue, réessaie dans un instant.");
      return;

}

async function enterRoom(c, host) {
  me.name = clean(me.name).trim();
  if (!me.name) { toast("Choisis d'abord un pseudo."); return; }
  if (busy || roomState !== "ok") return;
  store.set("pseudo", me.name); store.set("avatar", String(me.av));
  busy = true; render(true);
  let r = null;
  try {
    if (host) {
      for (let k = 0; k < 5 && !r; k++) { c = randCode(); try { r = await openHost(c); } catch (e) { if (!e || e.code !== "taken") throw e; } }
      if (!r) throw { code: "network" };
    } else r = await openClient(c);
  } catch (e) {
    busy = false; render(true);
    toast("Connexion impossible. Vérifie ta connexion internet et réessaie.");
    return;
  }
  busy = false;
  try { localStorage.setItem("tribunal-last", JSON.stringify({ c, t: Date.now() })); } catch (e) {}
  g = r; code = c; iAmHost = host; myAns = null; codeVisible = false; copied = false; searchStart = Date.now();
  try { if (location.hash) history.replaceState(null, "", location.pathname + location.search); } catch (e) {}

    H = { code: c, since: Date.now(), ph: "lobby", gid: 0, i: 0, plan: [], cur: null, res: null, showA: 0, s: 0, ver: VER, nm: {}, tot: {}, kind: {}, cnt, max: Object.fromEntries(MODES.map(m => [m.k, BANK[m.k].length])) };
    refreshAvail();

  pushPresence();

  setTimeout(() => render(true), 5200);
}

  const r = g; g = null; H = null; iAmHost = false; code = null; peers = []; myAns = null;
  if (r) { try { await r.leave(); } catch (e) {} }
  render(true);
}

/* ---------- host logic ---------- */
const STATS = ["tot", "kind", "mean", "maj", "mino", "did", "det", "guil", "ri", "rx", "ra"];

// classement : map[id] = [points, victoires, défaites]
function score(map, id, pts, win) { if (!id) return; const r = H[map][id] || [0, 0, 0]; H[map][id] = [r[0] + pts, r[1] + (win ? 1 : 0), r[2] + (win ? 0 : 1)]; }

}

}
function bump(map, id, n) { H[map][id] = (H[map][id] || 0) + (n == null ? 1 : n); }
function startGame() {

  if (!plan.length) { toast("Ajoute au moins une question."); return; }

}
function startRound() {

}

  if (m === "a" && s === 0) {
    const l = shuffle(ps.filter(p => typeof p.ans.v === "string" && p.ans.v.trim()).map(p => [clean(p.ans.v, MAX_TEXT), p.id]));

    if (l.length < 2) { reveal(); return; }
    H.s = 1; pushPresence(); return;
  }
  if (m === "i" && s === 0) {
    const ans = {};
    for (const p of ps) { const n = Number(p.ans.v); if (Number.isFinite(n)) ans[p.id] = Math.round(n * 10) / 10; }
    H.cur = Object.assign({}, H.cur, { ans }); H.s = 1; pushPresence(); return;

  else if (!g) { key = "home|" + roomState + "|" + busy; view = viewHome; }
  else if (!st) { key = "search|" + (Date.now() - searchStart > 5000); view = viewSearch; }
  else if (st.ph === "lobby") { key = "lobby|" + JSON.stringify([ps.map(p => [p.id, p.name, p.av, p.host]), st.cnt, st.max, st.usedN, st.ver, codeVisible, copied, rulesOpen]); view = () => viewLobby(st, ps); }
  else if (st.ph === "q") {
    const [m] = st.plan[st.i];
    const s = st.s | 0;
    const done = !!(myAns && myAns.g === st.gid && myAns.i === st.i && (myAns.s | 0) === s);
    const needPs = m === "u" || m === "d" || (m === "x" && s === 0) || (m === "i" && s === 1) || (m === "a" && s === 1);
    key = "q|" + st.gid + "|" + st.i + "|" + s + "|" + done + "|" + (done ? JSON.stringify(ps.map(p => [p.id, p.name, answered(p, st)])) : (needPs ? JSON.stringify(ps.map(p => [p.id, p.name, p.av])) : "")) + "|" + JSON.stringify(st.cur && [st.cur.acc, st.cur.ans, st.cur.imp, st.cur.by]);
    view = () => viewQuestion(st, ps, done);

  else { key = "end|" + st.gid + "|" + JSON.stringify([STATS.map(k => st[k]), st.hist, st.nm]); view = () => viewEnd(st); }

function viewReveal(st, ps) {

const pl = (n, w) => n + " " + w + (n > 1 ? "s" : "");
function bestOf(ids, f, dir) { if (!ids.length) return []; const v = dir > 0 ? Math.max(...ids.map(f)) : Math.min(...ids.map(f)); return ids.filter(id => f(id) === v); }

function recap(st) {
  const hist = Array.isArray(st.hist) ? st.hist : [];
  const nm = id => nameOf(st, id), names = ids => ids.map(nm).join(", ");
  const line = (q, a, cls) => h("div", { class: "rline" }, h("div", { class: "rq" }, String(q || "")), h("div", { class: "ra" + (cls ? " " + cls : "") }, String(a || "")));
  const sec = (k, rows) => rows.length ? h("div", { class: "panel recap" }, h("div", { class: "panel-title" }, "Récap · " + modeOf(k).label), ...rows) : null;
  const of = k => hist.filter(e => e && e.m === k);
  const map = k => st[k] || {};
  const out = [];
  for (const k of ["u", "d"]) out.push(sec(k, of(k).map(e => line(e.t, Array.isArray(e.w) && e.w.length ? e.w.map(([id, n]) => nm(id) + " (" + pl(n, "vote") + ")").join(k === "u" ? " / " : ", ") : "Aucun vote"))));

  const kind = map("kind"), mean = map("mean");
  const gIds = [...new Set([...Object.keys(kind), ...Object.keys(mean)])];
  if (gIds.length) {
    const nice = id => kind[id] | 0, bad = id => mean[id] | 0;
    const maxN = Math.max(...gIds.map(nice)), maxB = Math.max(...gIds.map(bad));
    out.push(sec("g", [
      line("😇 Les plus gentils", maxN > 0 ? names(gIds.filter(id => nice(id) === maxN)) + " (" + pl(maxN, "choix gentil") + ")" : "Personne. Bravo.", "good"),
      line("😈 Les connards", maxB > 0 ? names(gIds.filter(id => bad(id) === maxB)) + " (" + pl(maxB, "choix pas gentil") + ")" : "Personne, vous êtes des anges.", "bad"),
      ...gIds.slice().sort((a, b) => nice(b) - nice(a) || bad(a) - bad(b)).map(id => line(nm(id), nice(id) + " gentil · " + bad(id) + " pas gentil"))
    ]));
  }

  const pH = of("p");
  if (pH.length) {
    const maj = map("maj"), mino = map("mino"), ids = [...new Set([...Object.keys(maj), ...Object.keys(mino)])];
    const rows = pH.map(e => { const o = e.o || ["?", "?"], k = e.k || [0, 0]; return line(o[0] + "  ou  " + o[1], k[0] === k[1] ? "Égalité (" + k[0] + " partout)" : "Majorité : " + o[k[0] > k[1] ? 0 : 1] + " (" + Math.max(k[0], k[1]) + " contre " + Math.min(k[0], k[1]) + ")"); });
    if (ids.length) {
      const mj = bestOf(ids, id => maj[id] | 0, 1), mn = bestOf(ids, id => mino[id] | 0, 1);
      if ((maj[mj[0]] | 0) > 0) rows.unshift(line("🐑 Le mouton (toujours avec la majorité)", names(mj), "good"));
      if ((mino[mn[0]] | 0) > 0) rows.unshift(line("🦄 Le rebelle (toujours à contre-courant)", names(mn), "bad"));
    }
    out.push(sec("p", rows));
  }

  const nH = of("n");
  if (nH.length) {
    const did = map("did"), ids = Object.keys(did);
    const rows = nH.map(e => line(e.t, Array.isArray(e.ids) && e.ids.length ? "Déjà fait : " + names(e.ids) : "Personne ne l'a fait"));
    if (ids.length) {

      if ((did[wild[0]] | 0) > (did[wise[0]] | 0)) rows.unshift(line("😏 Le plus déjanté", names(wild) + " (" + (did[wild[0]] | 0) + " « déjà fait »)", "bad"));

  out.push(sec("t", of("t").map(e => line(e.t, "Top : " + clean(e.top, 40) + " · Flop : " + clean(e.low, 40)))));

  const iH = of("i");
  if (iH.length) {
    const det = map("det"), ids = Object.keys(det);
    const rows = iH.map(e => line(e.t, "Imposteur : " + nm(e.imp) + (e.c ? " → démasqué" : " → jamais démasqué"), e.c ? "good" : "bad"));
    if (ids.length) { const d = bestOf(ids, id => det[id] | 0, 1); rows.unshift(line("🕵️ Meilleur détective", names(d) + " (" + (det[d[0]] | 0) + ((det[d[0]] | 0) > 1 ? " bons votes" : " bon vote") + ")", "good")); }
    out.push(sec("i", rows));
  }

  out.push(sec("x", of("x").map(e => line(e.t, nm(e.acc) + " : " + (e.ok ? "COUPABLE" : "non coupable") + " (" + (e.gc | 0) + " contre " + (e.nc | 0) + ")", e.ok ? "bad" : "good"))));
  return out.filter(Boolean);
}

function viewEnd(st) {
  const ps = players();
  const tot = st.tot || {}, kind = st.kind || {}, mean = st.mean || {}, did = st.did || {}, det = st.det || {}, guil = st.guil || {};
  const all = [...new Set([...Object.keys(st.nm || {}), ...Object.keys(tot)])];
  const votes = id => tot[id] | 0;
  const ranked = all.slice().sort((a, b) => votes(b) - votes(a));
  const awards = [];
  if (Object.keys(tot).length) {
    const top = bestOf(all, votes, 1), low = bestOf(all, votes, -1);
    awards.push(["🎯 Cible n°1 du groupe", top, pl(votes(top[0]), "vote") + " reçu" + (votes(top[0]) > 1 ? "s" : "")]);
    if (all.length > 1 && votes(low[0]) < votes(top[0])) awards.push(["👻 L'intouchable", low, votes(low[0]) ? "Seulement " + pl(votes(low[0]), "vote") + " reçu" + (votes(low[0]) > 1 ? "s" : "") : "Personne n'a voté contre lui"]);
  }
  const kk = [...new Set([...Object.keys(kind), ...Object.keys(mean)])];
  if (kk.length) {
    const nice = id => kind[id] | 0, bad = id => mean[id] | 0;
    const angels = bestOf(kk, nice, 1), demons = bestOf(kk, bad, 1);
    if (nice(angels[0]) > 0) awards.push(["😇 Ange du groupe", angels, pl(nice(angels[0]), "choix gentil")]);
    if (bad(demons[0]) > 0) awards.push(["😈 Démon du groupe", demons, pl(bad(demons[0]), "choix pas gentil")]);
  }
  const dk = Object.keys(did);
  if (dk.length) { const w = bestOf(dk, id => did[id] | 0, 1); if ((did[w[0]] | 0) > 0) awards.push(["😏 Le plus déjanté", w, (did[w[0]] | 0) + " « déjà fait »"]); }
  const ek = Object.keys(det);
  if (ek.length) { const w = bestOf(ek, id => det[id] | 0, 1); if ((det[w[0]] | 0) > 0) awards.push(["🕵️ Meilleur détective", w, (det[w[0]] | 0) + ((det[w[0]] | 0) > 1 ? " imposteurs démasqués" : " imposteur démasqué")]); }
  const gk = Object.keys(guil);
  if (gk.length) { const w = bestOf(gk, id => guil[id] | 0, 1); if ((guil[w[0]] | 0) > 0) awards.push(["⚖️ Casier le plus chargé", w, pl(guil[w[0]] | 0, "condamnation")]); }

  const out = [...header("Fin de la partie"),
    awards.length ? h("div", { class: "stack" }, ...awards.map(([t, ids, sub]) => h("div", { class: "award" }, avatar(avOf(ps, ids[0])),
      h("div", null, h("div", { class: "t" }, t), h("div", { class: "n" }, ids.map(id => nameOf(st, id)).join(", ")), h("div", { class: "small muted" }, sub)))))
      : h("p", { class: "note" }, "Pas assez de votes pour décerner des titres.")];
  out.push(ranking(st, "ra", "Classement · Anecdotes", ["✓", "✗"]), ranking(st, "ri", "Classement · L'imposteur"), ranking(st, "rx", "Classement · Le procès"));
  out.push(...recap(st));
  if (ranked.length > 1) out.push(h("div", { class: "panel" }, h("div", { class: "panel-title" }, "Votes reçus au total"),
    h("div", { class: "bars" }, ...ranked.map(id => h("div", { class: "bar-top" }, h("span", null, nameOf(st, id)), h("b", null, String(votes(id))))))));
  if (iAmHost) out.push(h("button", { class: "btn green", onclick: backToLobby }, "Nouvelle partie"));
  else out.push(h("p", { class: "note" }, "L'hôte peut relancer une partie."));
  out.push(h("button", { class: "btn ghost", onclick: leave }, "Quitter"));
  return out;
}

  const PAL = {
    soft: { top: [40, 52, 150], bot: [104, 120, 224], build: "rgba(22,38,90,0.62)", glow: "rgba(246,201,76,0.55)", star: "#eef1ff", cloud: "rgba(205,214,255,0.20)", moon: "#f6f0cf", crater: "rgba(180,170,130,0.45)" },
    hard: { top: [20, 4, 16], bot: [118, 22, 50], build: "rgba(14,2,10,0.66)", glow: "rgba(255,90,106,0.6)", star: "#ffc7d4", cloud: "rgba(255,120,150,0.13)", moon: "#ff5a6a", crater: "rgba(150,20,40,0.5)" }
  };
  let W = 0, Hh = 0, stars = [], clouds = [], mood = "soft";
  const t0 = performance.now();
  function rnd(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
  function setup() {
    W = Math.max(60, Math.ceil(innerWidth / S)); Hh = Math.max(100, Math.ceil(innerHeight / S));
    cv.width = W; cv.height = Hh;
    const r = rnd(4242);
    stars = Array.from({ length: Math.round(W * Hh / 80) }, () => ({ x: Math.floor(r() * W), y: Math.floor(r() * Hh * 0.72), p: r() * 6.283, s: r() < 0.12 ? 2 : 1, sp: 0.5 + r() * 1.2 }));
    clouds = Array.from({ length: 5 }, () => ({ x: r() * W, y: 10 + r() * Hh * 0.4, w: 18 + Math.floor(r() * 28), v: 0.5 + r() * 1.1 }));
    draw();
  }
  function sky(P) {
    const bands = 14;
    for (let i = 0; i < bands; i++) {
      const k = i / (bands - 1), c = P.top.map((a, j) => Math.round(a + (P.bot[j] - a) * k));
      ctx.fillStyle = "rgb(" + c.join(",") + ")";
      ctx.fillRect(0, Math.floor(Hh * i / bands), W, Math.ceil(Hh / bands) + 1);
    }
  }
  function moon(P) {
    const r = Math.max(4, Math.floor(Math.min(W, Hh) * 0.045)), cx = 4 + r + 2, cy = 4 + r;
    ctx.fillStyle = P.moon;
    for (let y = -r; y <= r; y++) { const half = Math.floor(Math.sqrt(r * r - y * y)); ctx.fillRect(cx - half, cy + y, half * 2 + 1, 1); }
    ctx.fillStyle = P.crater;
    ctx.fillRect(cx - Math.floor(r / 3), cy - Math.floor(r / 3), 2, 2); ctx.fillRect(cx + Math.floor(r / 4), cy + Math.floor(r / 5), 3, 2); ctx.fillRect(cx - Math.floor(r / 6), cy + Math.floor(r / 2), 2, 1);
  }
  function court(P, t) {
    const cw = Math.min(Math.floor(W * 0.86), 150), x0 = Math.floor((W - cw) / 2), base = Hh - 7;
    const colH = Math.max(22, Math.floor(Hh * 0.16)), top = base - 9 - colH, ph = Math.max(8, Math.floor(cw * 0.17));
    ctx.fillStyle = P.build;
    ctx.fillRect(0, base + 3, W, Hh - base);                                  // sol
    for (let s = 0; s < 3; s++) ctx.fillRect(x0 - 8 + s * 3, base - s * 3, cw + 16 - s * 6, 3); // marches
    const n = 6, gap = cw / n;
    for (let i = 0; i < n; i++) { const cx = Math.floor(x0 + gap * i + gap * 0.25), w = Math.max(3, Math.floor(gap * 0.5)); ctx.fillRect(cx, top, w, colH); ctx.fillRect(cx - 1, top, w + 2, 2); ctx.fillRect(cx - 1, top + colH - 2, w + 2, 2); }
    ctx.fillRect(x0 - 5, top - 5, cw + 10, 5);                                // entablement
    for (let y = 0; y < ph; y++) { const half = Math.floor((cw / 2 + 6) * (y / ph)); ctx.fillRect(Math.floor(W / 2) - half, top - 5 - ph + y, half * 2, 1); } // fronton
    // balance de la justice dans le fronton, qui oscille doucement
    const bx = Math.floor(W / 2), by = top - 5 - Math.floor(ph * 0.55), tilt = Math.round(Math.sin(t * 0.9) * 1.4);
    ctx.fillStyle = P.glow;
    ctx.fillRect(bx, by - 2, 1, 5); ctx.fillRect(bx - 6, by - 2 + tilt, 6, 1); ctx.fillRect(bx + 1, by - 2 - tilt, 6, 1);
    ctx.fillRect(bx - 7, by + tilt, 3, 1); ctx.fillRect(bx + 5, by - tilt, 3, 1);
    // fenêtres éclairées entre les colonnes
    for (let i = 0; i < n - 1; i++) { const fx = Math.floor(x0 + gap * (i + 1) - 1); if ((i + Math.floor(t / 3)) % 3 !== 0) ctx.fillRect(fx, top + Math.floor(colH * 0.3), 2, 3); }
  }
  function draw() {
    const P = PAL[mood], t = (performance.now() - t0) / 1000;
    sky(P); moon(P);
    ctx.fillStyle = P.cloud;
    clouds.forEach(c => { const x = Math.floor(((c.x + t * c.v) % (W + c.w)) - c.w), y = Math.floor(c.y); ctx.fillRect(x, y, c.w, 3); ctx.fillRect(x + 4, y - 2, c.w - 10, 2); ctx.fillRect(x + 8, y - 3, Math.max(2, c.w - 20), 1); });
    ctx.fillStyle = P.star;
    stars.forEach(s => { ctx.globalAlpha = 0.25 + 0.75 * Math.abs(Math.sin(t * s.sp + s.p)); ctx.fillRect(s.x, s.y, s.s, s.s); });
    ctx.globalAlpha = 1;
    court(P, t);
  }
  let last = 0;
  function loop(now) { if (now - last > 150) { last = now; draw(); } requestAnimationFrame(loop); }
  addEventListener("resize", setup);
  setup();
  let still = false; try { still = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  if (!still) requestAnimationFrame(loop);
  window.setBackdropMood = m => { m = m === "hard" ? "hard" : "soft"; if (m !== mood) { mood = m; draw(); } };
})();

/* ---------- musique de fond (générée en direct, 100 % originale, libre de droits) ---------- */
const Music = (() => {
  const SONGS = {
    // Soft : la mineur, détendu (Am - F - C - G)
    soft: { bpm: 92, prog: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], arp: [0, 1, 2, 1, 0, 1, 2, 1],
      lead: [76, null, 74, null, 72, null, 69, null, 72, null, null, 74, 76, null, 79, null, 77, null, 76, null, 72, null, 69, null, 71, null, 72, null, 74, null, null, null],
      bassHits: [0, 3, 4, 6], drums: "soft", cutoff: 2600 },
    // Hardcore : ré mineur, plus nerveux (Dm - Bb - C - A)
    hard: { bpm: 122, prog: [[50, 53, 57], [46, 50, 53], [48, 52, 55], [45, 49, 52]], arp: [0, 2, 1, 2, 0, 2, 1, 2],
      lead: [74, null, 77, 74, 81, null, 77, null, 70, null, 74, 70, 77, null, 74, null, 72, null, 76, 72, 79, null, 76, null, 73, null, 76, 73, 81, null, 79, null],
      bassHits: [0, 2, 3, 4, 6, 7], drums: "hard", cutoff: 4200 }
  };
  let ctx = null, master = null, filter = null, timer = null, step = 0, next = 0, playing = false, mood = "soft", noise = null;
  let vol = (() => { const v = parseFloat(store.get("tribunal-vol")); return Number.isFinite(v) ? Math.min(1, Math.max(0, v)) : 0.4; })();
  let muted = store.get("tribunal-mute") === "1";
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  function level() { return muted ? 0 : vol * vol * 0.5; }
  function ensure() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    try { ctx = new AC(); } catch (e) { return false; }
    master = ctx.createGain(); master.gain.value = level();
    filter = ctx.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.value = SONGS[mood].cutoff;
    filter.connect(master); master.connect(ctx.destination);
    const len = Math.floor(ctx.sampleRate * 0.25); noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }
  function tone(t, freq, dur, type, gain) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(filter); o.start(t); o.stop(t + dur + 0.05);
  }
  function kick(t, gain) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.2);
  }
  function hiss(t, dur, gain, freq) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; f.type = "highpass"; f.frequency.value = freq;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
  }
  function schedule() {
    const song = SONGS[mood], eighth = 60 / song.bpm / 2;
    while (next < ctx.currentTime + 0.25) {
      const beat = step % 8, bar = Math.floor(step / 8) % 4, chord = song.prog[bar], t = next;
      if (song.bassHits.includes(beat)) tone(t, hz(chord[0] - 24), eighth * 0.9, "triangle", 0.30);
      tone(t, hz(chord[song.arp[beat]] + (beat >= 4 ? 12 : 0)), eighth * 0.7, "square", 0.045);
      const ln = song.lead[step % 32]; if (ln && Math.floor(step / 32) % 2 === 1) tone(t, hz(ln), eighth * 1.6, "square", 0.05);
      if (song.drums === "soft") { if (beat === 0) kick(t, 0.35); if (beat % 2 === 1) hiss(t, 0.03, 0.025, 7000); }
      else { if (beat % 4 === 0) kick(t, 0.5); if (beat === 2 || beat === 6) hiss(t, 0.12, 0.09, 1800); hiss(t, 0.025, 0.03, 8000); }
      next += eighth; step++;
    }
  }
  return {
    start() {
      if (!ensure()) return;
      if (ctx.state === "suspended") ctx.resume().catch(() => {});
      if (playing) return;
      playing = true; next = ctx.currentTime + 0.08; step = 0;
      timer = setInterval(schedule, 60); schedule();
    },
    setMood(m) {
      m = m === "hard" ? "hard" : "soft"; if (m === mood) return;
      mood = m; if (filter) filter.frequency.setTargetAtTime(SONGS[m].cutoff, ctx.currentTime, 0.2);
      step = Math.floor(step / 8) * 8;
    },
    setVolume(v) { vol = Math.min(1, Math.max(0, v)); store.set("tribunal-vol", String(vol)); if (vol > 0 && muted) this.setMuted(false); else if (master) master.gain.setTargetAtTime(level(), ctx.currentTime, 0.05); },
    setMuted(m) { muted = !!m; store.set("tribunal-mute", muted ? "1" : "0"); if (master) master.gain.setTargetAtTime(level(), ctx.currentTime, 0.05); if (!muted) this.start(); },
    get muted() { return muted; }, get volume() { return vol; }
  };
})();

(function musicControls() {
  const btn = h("button", { class: "music-btn", id: "music-btn", type: "button", "aria-expanded": "false", "aria-label": "Musique et volume", title: "Musique" });
  const panel = h("div", { class: "music-panel", id: "music-panel", hidden: true });
  const mute = h("button", { class: "music-mute", type: "button" });
  const slider = h("input", { type: "range", id: "music-vol", min: "0", max: "100", step: "1", "aria-label": "Volume de la musique" });
  const pct = h("span", { class: "music-pct" });
  function sync() {
    const v = Math.round(Music.volume * 100);
    slider.value = String(v); pct.textContent = Music.muted ? "Coupé" : v + " %";
    btn.textContent = Music.muted || v === 0 ? "🔇" : "🎵";
    mute.textContent = Music.muted ? "🔈 Activer le son" : "🔇 Couper le son";
  }
  btn.onclick = e => { e.stopPropagation(); panel.hidden = !panel.hidden; btn.setAttribute("aria-expanded", String(!panel.hidden)); };
  mute.onclick = () => { Music.setMuted(!Music.muted); sync(); };
  slider.oninput = () => { Music.setVolume(Number(slider.value) / 100); sync(); };
  panel.append(h("div", { class: "music-title" }, "Musique"), h("div", { class: "music-row" }, slider, pct), mute,
    h("p", { class: "music-note" }, "Réglage propre à ton appareil."));
  document.addEventListener("pointerdown", e => { if (!panel.hidden && !panel.contains(e.target) && e.target !== btn) { panel.hidden = true; btn.setAttribute("aria-expanded", "false"); } });
  document.body.append(btn, panel);
  sync();
  const kick = () => { if (!Music.muted) Music.start(); };
  ["pointerdown", "keydown", "touchend"].forEach(ev => document.addEventListener(ev, kick, { once: true, passive: true }));
})();

/* ---------- écran d'accueil (avant le menu) ---------- */
(function splash() {
  const svg = '<svg class="gavel" viewBox="0 0 40 30" shape-rendering="crispEdges" aria-hidden="true">'
    + '<g class="block"><rect x="0" y="20" width="22" height="5" fill="#5a3418"/><rect x="0" y="20" width="22" height="1" fill="#9a6232"/><rect x="2" y="25" width="18" height="2" fill="#3e230f"/></g>'
    + '<g class="hammer">'
    +   '<rect x="20" y="13" width="3" height="3" fill="#8b4a2b"/><rect x="23" y="16" width="3" height="3" fill="#8b4a2b"/><rect x="26" y="19" width="3" height="3" fill="#8b4a2b"/><rect x="29" y="22" width="3" height="3" fill="#8b4a2b"/><rect x="32" y="25" width="3" height="3" fill="#6e3820"/>'
    +   '<rect x="2" y="10" width="18" height="10" fill="#8b4a2b"/><rect x="2" y="10" width="18" height="2" fill="#b8693e"/><rect x="2" y="18" width="18" height="2" fill="#6e3820"/>'
    +   '<rect x="5" y="10" width="2" height="10" fill="#f6c94c"/><rect x="15" y="10" width="2" height="10" fill="#f6c94c"/>'
    + '</g></svg>';
  const go = h("button", { class: "btn green splash-go", type: "button" }, "▶ Appuie pour jouer");
  const el = h("div", { class: "splash", role: "dialog", "aria-modal": "true", "aria-label": "Tribunal des Potes" },
    h("div", { class: "splash-inner" },
      h("div", { class: "gavel-wrap" }),
      h("div", { class: "ordre", "aria-hidden": "true" }, "ORDRE !"),
      h("div", { class: "splash-title" }, h("span", null, "Tribunal"), h("span", null, "des Potes")),
      h("p", { class: "splash-tag" }, "Le jeu qui juge tes potes"),
      go,
      h("p", { class: "splash-foot" }, "😇 Soft · 🔥 Hardcore · 9 mini-jeux · 🔊 avec le son")));
  el.querySelector(".gavel-wrap").innerHTML = svg;
  document.body.append(el);
  document.body.classList.add("splashing");
  try { go.focus({ preventScroll: true }); } catch (e) {}
  let gone = false;
  const enter = () => {
    if (gone) return; gone = true;
    if (!Music.muted) Music.start();
    el.classList.add("out");
    document.body.classList.remove("splashing");
    setTimeout(() => el.remove(), 450);
  };
  el.addEventListener("click", enter);
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " " || e.key === "Escape") { e.preventDefault(); enter(); } });
})();

/* ---------- boîte du jeu de société (avant l'écran d'accueil) ---------- */
(function boxIntro() {
  const gavel = '<svg viewBox="0 0 40 30" shape-rendering="crispEdges" aria-hidden="true" class="cover-gavel">'
    + '<rect x="0" y="20" width="22" height="5" fill="#5a3418"/><rect x="0" y="20" width="22" height="1" fill="#9a6232"/>'
    + '<g transform="rotate(18 34 27)"><rect x="20" y="13" width="3" height="3" fill="#8b4a2b"/><rect x="23" y="16" width="3" height="3" fill="#8b4a2b"/><rect x="26" y="19" width="3" height="3" fill="#8b4a2b"/><rect x="29" y="22" width="3" height="3" fill="#8b4a2b"/><rect x="32" y="25" width="3" height="3" fill="#6e3820"/>'
    + '<rect x="2" y="10" width="18" height="10" fill="#8b4a2b"/><rect x="2" y="10" width="18" height="2" fill="#b8693e"/><rect x="5" y="10" width="2" height="10" fill="#f6c94c"/><rect x="15" y="10" width="2" height="10" fill="#f6c94c"/></g></svg>';
  const faces = [0, 3, 6, 9, 11].map(i => avatar(i, true));
  const front = h("div", { class: "face front" },

    h("div", { class: "cover-title" }, h("span", null, "Tribunal"), h("span", null, "des Potes")),
    h("div", { class: "cover-tag" }, "Le jeu qui juge tes potes"),
    h("div", { class: "cover-faces" }, ...faces),
    h("div", { class: "cover-badges" }, h("span", null, "👥 Dès 3 joueurs"), h("span", null, "⏱ 45 min"), h("span", null, "📱 Sur téléphone")),
    h("div", { class: "cover-sticker" }, h("b", null, "🔥"), "Version", h("br"), "Hardcore", h("br"), "18+ incluse"));
  front.querySelector(".cover-art").innerHTML = gavel;
  const side = h("div", { class: "face side" }, h("span", null, "TRIBUNAL DES POTES"));
  const top = h("div", { class: "face top" });
  const lid = h("div", { class: "box3d" }, front, side, top);
  const hint = h("button", { class: "btn green intro-go", type: "button" }, "Ouvrir la boîte");
  const el = h("div", { class: "intro", role: "dialog", "aria-modal": "true", "aria-label": "Boîte du jeu Tribunal des Potes" },
    h("div", { class: "table-light" }),
    h("div", { class: "box-stage" }, lid, h("div", { class: "box-shadow" })),
    hint);
  document.body.append(el);
  try { hint.focus({ preventScroll: true }); } catch (e) {}
  let gone = false;
  const open = () => {
    if (gone) return; gone = true;
    el.classList.add("opening");
    const sp = document.querySelector(".splash .splash-go");
    setTimeout(() => { el.remove(); if (sp) { try { sp.focus({ preventScroll: true }); } catch (e) {} } }, 900);
  };
  el.addEventListener("click", e => { e.stopPropagation(); open(); });
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " " || e.key === "Escape") { e.preventDefault(); e.stopPropagation(); open(); } });
})();

render(true);
